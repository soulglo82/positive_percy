name: CI

on:
  push:
    branches: [claude/migrate-base64-percy-code-PNAym]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Throwaway database for the server security tests. Without it those
    # tests skip, so CI must provide one.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: percy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run accessibility tests (axe-core)
        run: npm run test:a11y

      - name: Run all tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/percy_test
