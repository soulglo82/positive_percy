  --pv-ink: #271737;
  --pv-lilac: #E5DCEA;
  --pv-white: #FFFFFF;
  /* ---- Colour: V1 semantic, LOCKED ---- */
  --pv-ink-soft: #594E69;         /* supporting text: 7.2:1 on cream */
  --pv-earn: #2A6E33;             /* earned / completed: 6.2:1 on white */
  --pv-earn-soft: #E3F2E5;
  --pv-star-soft: #FFF1D1;
  --pv-danger: #B42318;
  --pv-input-border: #857A96;
  --pv-kid-1: #1F6FB2; --pv-kid-1-soft: #DCEBF8;
  --pv-kid-2: #C0265E; --pv-kid-2-soft: #FBE1EA;
  --pv-kid-3: #0E7A7E; --pv-kid-3-soft: #D3EFEF;
  --pv-kid-4: #8A6B0F; --pv-kid-4-soft: #EEEBD5;
  --pv-kid-5: #7A4B2A; --pv-kid-5-soft: #F1E4D8;
  --pv-kid-6: #4A5A6A; --pv-kid-6-soft: #E2E7EC;
  /* ---- Colour: scene tints, NEW (decoration only, never text) ---- */
  --pv-lilac-mist: #F3ECFA;
  --pv-sky-warm: #FFE9B5;
  --pv-peach-soft: #FFE3CC;
  --pv-meadow: #CFEBC9;
  --pv-meadow-deep: #A9D9A5;
  --pv-orange-text: #B34700;      /* orange that passes as text: 5.1:1 on cream */

  /* ---- Semantic colour roles ---- */
  --pv-bg: var(--pv-cream);
  --pv-surface: var(--pv-white);
  --pv-text: var(--pv-ink);
  --pv-text-soft: var(--pv-ink-soft);
  --pv-heading: var(--pv-purple);
  --pv-action: var(--pv-purple);
  --pv-action-hover: var(--pv-purple-deep);
  --pv-on-action: var(--pv-white);
  --pv-border: var(--pv-lilac);
  --pv-focus: var(--pv-purple);
  --pv-focus-on-dark: var(--pv-sunshine);

  /* ---- Type families and weights, LOCKED ---- */
  --pv-font-display: 'Nunito', 'Poppins', ui-sans-serif, system-ui, sans-serif;  /* 700, 800 only */
  --pv-font-body: 'Poppins', ui-sans-serif, system-ui, sans-serif;                /* 400, 500, 600 only */

  /* ---- Type roles: size / line-height (phone). NEW ---- */
  --pv-hero-size: 2rem;        --pv-hero-line: 2.375rem;    /* 32/38 Nunito 800 */
  --pv-page-size: 1.75rem;     --pv-page-line: 2.125rem;    /* 28/34 Nunito 800 */
  --pv-section-size: 1.375rem; --pv-section-line: 1.75rem;  /* 22/28 Nunito 800 */
  --pv-card-size: 1.125rem;    --pv-card-line: 1.5rem;      /* 18/24 Nunito 700 */
  --pv-body-size: 1rem;        --pv-body-line: 1.5rem;      /* 16/24 Poppins 400 */
  --pv-support-size: 0.875rem; --pv-support-line: 1.25rem;  /* 14/20 Poppins 400 */
  --pv-action-size: 0.9375rem; --pv-action-line: 1.25rem;   /* 15/20 Poppins 600 */
  --pv-meta-size: 0.75rem;     --pv-meta-line: 1rem;        /* 12/16 Poppins 600: tab labels and non-essential metadata only */
  --pv-number-size: 2.25rem;   --pv-number-line: 2.5rem;    /* 36/40 Nunito 800 tabular */
  --pv-number-sm-size: 1.5rem; --pv-number-sm-line: 1.75rem;/* 24/28 Nunito 800 tabular: inside rings */

  /* ---- Spacing: 8px cadence with 4px substeps. NEW ---- */
  --pv-space-1: 0.25rem;  /* 4 */
  --pv-space-2: 0.5rem;   /* 8 */
  --pv-space-3: 0.75rem;  /* 12 */
  --pv-space-4: 1rem;     /* 16 */
  --pv-space-5: 1.5rem;   /* 24 */
  --pv-space-6: 2rem;     /* 32 */
  --pv-space-7: 2.5rem;   /* 40 */
  --pv-space-8: 3rem;     /* 48 */
  --pv-gutter: 1rem;      /* page content edge: 16 on phones */
  --pv-content-max: 70rem;/* 1120 */

  /* ---- Radius. NEW ---- */
  --pv-radius-control: 0.875rem; /* 14: buttons, inputs, rows */
  --pv-radius-card: 1.25rem;     /* 20: cards and tiles */
  --pv-radius-scene: 1.75rem;    /* 28: illustrated scenes */
  --pv-radius-full: 999px;

  /* ---- Elevation. NEW ---- */
  --pv-shadow-1: 0 1px 2px rgb(39 23 55 / 0.06), 0 2px 6px rgb(39 23 55 / 0.06);
  --pv-shadow-2: 0 2px 4px rgb(39 23 55 / 0.06), 0 10px 24px rgb(75 29 140 / 0.12);
  --pv-shadow-photo: 0 2px 4px rgb(39 23 55 / 0.10), 0 8px 18px rgb(39 23 55 / 0.16);

  /* ---- Sizes ---- */
  --pv-tap: 2.75rem;                 /* 44 minimum touch target, LOCKED */
  --pv-icon: 1.5rem;                 /* 24 inline icon */
  --pv-icon-medallion: 3rem;         /* 48 icon medallion */
  --pv-avatar-selected: 4.5rem;      /* 72 selected child, Home */
  --pv-avatar-other: 3.25rem;        /* 52 other children */
  --pv-avatar-profile: 6.5rem;       /* 104 Children profile hero */
  --pv-ring: 6rem;                   /* 96 progress ring */
  --pv-ring-stroke: 0.625rem;        /* 10 */
  --pv-focus-width: 3px;
  --pv-focus-offset: 2px;
  --pv-nav-height: 4.25rem;          /* 68 bottom tab bar */
  --pv-rail-width: 15rem;            /* 240 desktop side rail */

  /* ---- Fox illustration slots (rendered height; width follows the 365:459 master) ---- */
  --pv-fox-small: 3rem;   /* 48 */
  --pv-fox-mid: 6rem;     /* 96 */
  --pv-fox-hero: 9rem;    /* 144 phone hero */

  /* ---- Motion. NEW ---- */
  --pv-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --pv-ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --pv-dur-quick: 150ms;      /* press, toggle */
  --pv-dur-base: 240ms;       /* enter, ring fill start */
  --pv-dur-celebrate: 700ms;  /* one-shot Percy response */
  --pv-dur-loop: 2400ms;      /* gentle idle loop */
}

/* Tablet and desktop type steps */
@media (min-width: 834px) {
  :root {
    --pv-hero-size: 2.75rem;     --pv-hero-line: 3.25rem;   /* 44/52 */
    --pv-page-size: 2.125rem;    --pv-page-line: 2.625rem;  /* 34/42 */
    --pv-section-size: 1.625rem; --pv-section-line: 2rem;   /* 26/32 */
    --pv-card-size: 1.25rem;     --pv-card-line: 1.625rem;  /* 20/26 */
    --pv-number-size: 2.75rem;   --pv-number-line: 3rem;    /* 44/48 */
    --pv-gutter: 2rem;
    --pv-avatar-selected: 5.5rem;   /* 88 */
    --pv-avatar-other: 4rem;        /* 64 */
    --pv-avatar-profile: 8.5rem;    /* 136 */
    --pv-ring: 7rem;                /* 112 */
    --pv-fox-hero: 13rem;           /* 208 */
  }
}

/* Positive Percy V1.1 component styles
 * Version 0.1.0 · Issued 2026-11-23 · Owner: Percy V1.1 design engineering
 * Status: PROPOSAL (stop gate P2). Reads only tokens from percy-v11-tokens.css.
 * No pixel literals for type, colour or spacing: add a token instead.
 */
*, *::before, *::after { box-sizing: border-box; }
html { font-synthesis: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--pv-bg); color: var(--pv-text);
  font-family: var(--pv-font-body); font-size: var(--pv-body-size); line-height: var(--pv-body-line);
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: var(--pv-focus-width) solid var(--pv-focus); outline-offset: var(--pv-focus-offset); }
.pv-on-dark :focus-visible { outline-color: var(--pv-focus-on-dark); }
.pv-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- Type roles ---------- */
.pv-t-hero    { font: 800 var(--pv-hero-size)/var(--pv-hero-line) var(--pv-font-display); color: var(--pv-heading); letter-spacing: -0.01em; text-wrap: balance; }
.pv-t-page    { font: 800 var(--pv-page-size)/var(--pv-page-line) var(--pv-font-display); color: var(--pv-heading); letter-spacing: -0.01em; text-wrap: balance; }
.pv-t-section { font: 800 var(--pv-section-size)/var(--pv-section-line) var(--pv-font-display); color: var(--pv-heading); }
.pv-t-card    { font: 700 var(--pv-card-size)/var(--pv-card-line) var(--pv-font-display); color: var(--pv-text); }
.pv-t-body    { font: 400 var(--pv-body-size)/var(--pv-body-line) var(--pv-font-body); }
.pv-t-support { font: 400 var(--pv-support-size)/var(--pv-support-line) var(--pv-font-body); color: var(--pv-text-soft); }
.pv-t-action  { font: 600 var(--pv-action-size)/var(--pv-action-line) var(--pv-font-body); }
.pv-t-meta    { font: 600 var(--pv-meta-size)/var(--pv-meta-line) var(--pv-font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--pv-text-soft); }
.pv-t-number  { font: 800 var(--pv-number-size)/var(--pv-number-line) var(--pv-font-display); font-variant-numeric: tabular-nums; }
.pv-t-number-sm { font: 800 var(--pv-number-sm-size)/var(--pv-number-sm-line) var(--pv-font-display); font-variant-numeric: tabular-nums; }
.pv-wrap, .pv-t-hero, .pv-t-page, .pv-t-section, .pv-t-card { overflow-wrap: anywhere; hyphens: auto; }

/* ---------- Icon ---------- */
.pv-icon { width: var(--pv-icon); height: var(--pv-icon); flex: none; }
.pv-medallion {
  width: var(--pv-icon-medallion); height: var(--pv-icon-medallion); flex: none;
  display: grid; place-items: center; border-radius: var(--pv-radius-full);
  background: var(--pv-white); color: var(--pv-purple);
}
.pv-medallion .pv-icon { width: calc(var(--pv-icon) + var(--pv-space-1)); height: calc(var(--pv-icon) + var(--pv-space-1)); }

/* ---------- Button ---------- */
.pv-btn {
  max-width: 100%; flex-wrap: wrap; /* with very large text the icon moves above the label instead of squeezing it */
  display: inline-flex; align-items: center; justify-content: center; gap: var(--pv-space-2);
  min-height: var(--pv-tap); padding: var(--pv-space-3) var(--pv-space-4);
  border-radius: var(--pv-radius-control); border: 2px solid transparent;
  font: 600 var(--pv-action-size)/var(--pv-action-line) var(--pv-font-body); text-align: center;
  transition: background-color var(--pv-dur-quick) var(--pv-ease-out), transform var(--pv-dur-quick) var(--pv-ease-out);
}
.pv-btn:active { transform: scale(0.98); }
.pv-btn--primary { background: var(--pv-action); color: var(--pv-on-action); }
.pv-btn--primary:hover { background: var(--pv-action-hover); }
.pv-btn--secondary { background: var(--pv-white); color: var(--pv-purple); border-color: var(--pv-purple); }
.pv-btn--secondary:hover { background: var(--pv-lilac-mist); }
.pv-btn--quiet { color: var(--pv-purple); padding-inline: var(--pv-space-3); text-decoration: underline; text-underline-offset: 0.2em; }
.pv-btn--sun { background: var(--pv-sunshine); color: var(--pv-ink); }
.pv-btn--block { display: flex; width: 100%; }

/* ---------- ChildAvatar (photo first) ---------- */
.pv-avatar {
  --kid: var(--pv-purple); --kid-soft: var(--pv-lilac);
  --size: var(--pv-avatar-other);
  position: relative; flex: none; width: var(--size); height: var(--size);
  border-radius: var(--pv-radius-full); background: var(--kid-soft); color: var(--kid);
  display: grid; place-items: center; overflow: hidden;
  font: 800 calc(var(--size) * 0.42)/1 var(--pv-font-display);
  box-shadow: 0 0 0 3px var(--pv-white), var(--pv-shadow-photo);
}
.pv-avatar[data-size="selected"] { --size: var(--pv-avatar-selected); }
.pv-avatar[data-size="profile"]  { --size: var(--pv-avatar-profile); }
.pv-avatar[data-size="row"]      { --size: var(--pv-tap); box-shadow: 0 0 0 2px var(--pv-white); }
.pv-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.pv-avatar[data-ring] { box-shadow: 0 0 0 3px var(--pv-white), 0 0 0 6px var(--kid), var(--pv-shadow-photo); }
[data-kid="1"] { --kid: var(--pv-kid-1); --kid-soft: var(--pv-kid-1-soft); }
[data-kid="2"] { --kid: var(--pv-kid-2); --kid-soft: var(--pv-kid-2-soft); }
[data-kid="3"] { --kid: var(--pv-kid-3); --kid-soft: var(--pv-kid-3-soft); }
[data-kid="4"] { --kid: var(--pv-kid-4); --kid-soft: var(--pv-kid-4-soft); }
[data-kid="5"] { --kid: var(--pv-kid-5); --kid-soft: var(--pv-kid-5-soft); }
[data-kid="6"] { --kid: var(--pv-kid-6); --kid-soft: var(--pv-kid-6-soft); }

/* ---------- ChildSelector ---------- */
.pv-selector {
  display: flex; align-items: flex-end; gap: var(--pv-space-4);
  overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
  /* room for the avatar ring and focus outline inside the scroller */
  padding: var(--pv-space-3) var(--pv-gutter); margin-inline: calc(var(--pv-gutter) * -1);
}
.pv-selector::-webkit-scrollbar { display: none; }
.pv-selector__item {
  flex: none; scroll-snap-align: center;
  display: grid; justify-items: center; gap: var(--pv-space-2);
  min-width: var(--pv-avatar-selected); max-width: calc(var(--pv-avatar-selected) + var(--pv-space-6));
  border-radius: var(--pv-radius-card);
}
.pv-selector__name {
  font: 600 var(--pv-action-size)/var(--pv-action-line) var(--pv-font-body); color: var(--pv-text-soft);
  text-align: center; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.pv-selector__item[aria-pressed="true"] .pv-selector__name { color: var(--pv-purple); }
.pv-selector__item[aria-pressed="true"] .pv-selector__name::after {
  content: ""; display: block; height: var(--pv-space-1); width: var(--pv-space-5); margin: var(--pv-space-1) auto 0;
  border-radius: var(--pv-radius-full); background: var(--pv-orange);
}
.pv-selector__item .pv-avatar { transition: width var(--pv-dur-base) var(--pv-ease-out), height var(--pv-dur-base) var(--pv-ease-out); }

/* ---------- QuickPointTile ---------- */
/* Two across on phones; one across when larger text leaves no room for two. */
.pv-quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 8.5rem), 1fr)); gap: var(--pv-space-3); }
.pv-quick-tile {
  --tint: var(--pv-star-soft);
  position: relative; display: grid; grid-template-columns: auto 1fr; align-items: start; gap: var(--pv-space-3) var(--pv-space-2);
  min-height: calc(var(--pv-tap) * 2.5); padding: var(--pv-space-4);
  border-radius: var(--pv-radius-card); background: var(--tint); color: var(--pv-ink);
  box-shadow: var(--pv-shadow-1);
  transition: transform var(--pv-dur-quick) var(--pv-ease-out), box-shadow var(--pv-dur-quick) var(--pv-ease-out);
}
.pv-quick-tile:hover { box-shadow: var(--pv-shadow-2); }
.pv-quick-tile:active { transform: scale(0.97); }
.pv-quick-tile[data-tint="lilac"] { --tint: var(--pv-lilac); }
.pv-quick-tile[data-tint="green"] { --tint: var(--pv-earn-soft); }
.pv-quick-tile[data-tint="peach"] { --tint: var(--pv-peach-soft); }
.pv-quick-tile__points {
  justify-self: end; padding: var(--pv-space-1) var(--pv-space-3); border-radius: var(--pv-radius-full);
  background: var(--pv-sunshine); color: var(--pv-ink);
  font: 800 var(--pv-action-size)/var(--pv-action-line) var(--pv-font-display);
}
.pv-quick-tile__label { grid-column: 1 / -1; align-self: end; font: 600 var(--pv-action-size)/var(--pv-action-line) var(--pv-font-body); overflow-wrap: anywhere; }
.pv-quick-tile[data-given] .pv-medallion { background: var(--pv-earn); color: var(--pv-white); animation: pv-pop var(--pv-dur-celebrate) var(--pv-ease-bounce); }

/* ---------- TodayGoalRow ---------- */
.pv-goals { display: grid; gap: var(--pv-space-2); }
/* Check, text, Undo on one line; with very large text the text takes its own line. */
.pv-goal {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--pv-space-2) var(--pv-space-3);
  min-height: calc(var(--pv-tap) + var(--pv-space-5)); padding: var(--pv-space-3) var(--pv-space-3) var(--pv-space-3) var(--pv-space-2);
  border-radius: var(--pv-radius-control); background: var(--pv-white); border: 2px solid var(--pv-border);
  transition: background-color var(--pv-dur-base) var(--pv-ease-out), border-color var(--pv-dur-base) var(--pv-ease-out);
}
.pv-goal[data-done] { background: var(--pv-earn-soft); border-color: var(--pv-earn-soft); }
.pv-goal__check { width: var(--pv-tap); height: var(--pv-tap); display: grid; place-items: center; border-radius: var(--pv-radius-full); }
.pv-goal__check span {
  width: var(--pv-space-6); height: var(--pv-space-6); display: grid; place-items: center;
  border-radius: var(--pv-radius-full); border: 2px solid var(--pv-input-border); background: var(--pv-white); color: transparent;
}
.pv-goal[data-done] .pv-goal__check span { background: var(--pv-earn); border-color: var(--pv-earn); color: var(--pv-white); animation: pv-pop var(--pv-dur-celebrate) var(--pv-ease-bounce); }
.pv-goal__check .pv-icon { width: var(--pv-space-5); height: var(--pv-space-5); }
.pv-goal__check .pv-icon [opacity] { display: none; }
.pv-goal > div { flex: 1 1 8rem; min-width: 0; }
.pv-goal__title { font: 500 var(--pv-body-size)/var(--pv-body-line) var(--pv-font-body); overflow-wrap: anywhere; }
.pv-goal__meta { font: 400 var(--pv-support-size)/var(--pv-support-line) var(--pv-font-body); color: var(--pv-text-soft); }
.pv-goal[data-done] .pv-goal__meta { color: var(--pv-earn); font-weight: 600; }
.pv-goal__undo { min-height: var(--pv-tap); min-width: var(--pv-tap); padding-inline: var(--pv-space-2); font: 600 var(--pv-action-size)/var(--pv-action-line) var(--pv-font-body); color: var(--pv-purple); text-decoration: underline; text-underline-offset: 0.2em; border-radius: var(--pv-radius-control); }
.pv-progress-dots { display: inline-flex; gap: var(--pv-space-1); align-items: center; }
.pv-progress-dots i { width: var(--pv-space-3); height: var(--pv-space-3); border-radius: var(--pv-radius-full); background: var(--pv-lilac); }
.pv-progress-dots i[data-on] { background: var(--pv-earn); }
.pv-empty {
  display: grid; gap: var(--pv-space-3); justify-items: start; padding: var(--pv-space-5);
  border-radius: var(--pv-radius-card); background: var(--pv-lilac-mist); border: 2px dashed var(--pv-lilac);
}

/* ---------- PercyProgressRing ---------- */
.pv-ring { position: relative; width: var(--pv-ring); height: var(--pv-ring); flex: none; color: var(--pv-purple); }
.pv-ring > svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.pv-ring__track { fill: var(--pv-white); stroke: var(--pv-lilac); }
.pv-ring__value { fill: none; stroke: currentColor; stroke-linecap: round; transition: stroke-dashoffset var(--pv-dur-celebrate) var(--pv-ease-out); }
.pv-ring[data-metric="today"] { color: var(--pv-earn); }
.pv-ring[data-metric="week"]  { color: var(--pv-purple); }
.pv-ring[data-metric="goal"]  { color: var(--pv-orange); }
.pv-ring[data-empty] .pv-ring__track { stroke-dasharray: 2 5; stroke: var(--pv-input-border); }
.pv-ring__centre { position: absolute; inset: 0; display: grid; place-items: center; color: var(--pv-purple); }
.pv-ring__centre .pv-icon { width: calc(var(--pv-ring) * 0.34); height: calc(var(--pv-ring) * 0.34); }
.pv-ring[data-full] .pv-ring__centre { color: var(--pv-earn); }
.pv-ring[data-empty] .pv-ring__centre { color: var(--pv-text-soft); }

/* ---------- Journey (Children) ---------- */
.pv-journey { position: relative; display: grid; gap: var(--pv-space-5); }
.pv-journey::before { /* the trail: runs through the ring centres */
  content: ""; position: absolute; top: calc(var(--pv-ring) / 2); bottom: calc(var(--pv-ring) / 2);
  left: calc(var(--pv-ring) / 2 - var(--pv-space-1)); width: var(--pv-space-2);
  background: repeating-linear-gradient(to bottom, var(--pv-cream) 0 var(--pv-space-3), transparent var(--pv-space-3) var(--pv-space-5));
  border-radius: var(--pv-radius-full);
}
.pv-stop { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: var(--pv-space-3) var(--pv-space-4); }
.pv-stop > :last-child { flex: 1 1 8rem; min-width: 0; }
.pv-stop__figure { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 var(--pv-space-2); color: var(--pv-ink); }
.pv-stop__figure small { font: 500 var(--pv-body-size)/var(--pv-body-line) var(--pv-font-body); color: var(--pv-text-soft); }
.pv-stop__label { font: 700 var(--pv-card-size)/var(--pv-card-line) var(--pv-font-display); color: var(--pv-purple); overflow-wrap: anywhere; }
.pv-stop__note { font: 400 var(--pv-support-size)/var(--pv-support-line) var(--pv-font-body); color: var(--pv-text-soft); }
.pv-stop__note[data-tone="earn"] { color: var(--pv-earn); font-weight: 600; }

/* ---------- BiggerGoalDestination ---------- */
.pv-destination { border-radius: var(--pv-radius-card); background: var(--pv-white); box-shadow: var(--pv-shadow-2); overflow: hidden; }
.pv-destination__scene { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: var(--pv-space-3); padding: var(--pv-space-4) var(--pv-space-4) 0; background: linear-gradient(var(--pv-sky-warm), var(--pv-star-soft)); }
.pv-destination__art { width: calc(var(--pv-tap) * 2); height: calc(var(--pv-tap) * 2); padding: var(--pv-space-3); margin-bottom: var(--pv-space-3); border-radius: var(--pv-radius-card); background: var(--pv-white); box-shadow: var(--pv-shadow-1); color: var(--pv-purple); display: grid; place-items: center; }
.pv-destination__art .pv-icon { width: 100%; height: 100%; }
.pv-destination__flag { align-self: end; padding-bottom: var(--pv-space-3); }
.pv-destination__body { display: grid; gap: var(--pv-space-3); padding: var(--pv-space-4); }
.pv-bar { height: var(--pv-space-3); border-radius: var(--pv-radius-full); background: var(--pv-lilac); overflow: hidden; }
.pv-bar i { display: block; height: 100%; border-radius: inherit; background: var(--pv-orange); transition: width var(--pv-dur-celebrate) var(--pv-ease-out); }

/* ---------- AchievementBanner ---------- */
.pv-achievement { display: flex; flex-wrap: wrap; align-items: center; gap: var(--pv-space-3); padding: var(--pv-space-4); border-radius: var(--pv-radius-card); background: var(--pv-star-soft); }
.pv-achievement > div { flex: 1 1 8rem; min-width: 0; }
.pv-achievement .pv-medallion { background: var(--pv-sunshine); color: var(--pv-ink); }
.pv-achievement[data-state="next"] { background: var(--pv-white); border: 2px solid var(--pv-border); }
.pv-achievement[data-state="next"] .pv-medallion { background: var(--pv-lilac); color: var(--pv-purple); }

/* ---------- ManageAction ---------- */
.pv-manage { display: grid; gap: var(--pv-space-2); }
.pv-manage-action {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--pv-space-3);
  min-height: calc(var(--pv-tap) + var(--pv-space-5)); padding: var(--pv-space-3) var(--pv-space-4);
  border-radius: var(--pv-radius-control); background: var(--pv-white); border: 2px solid var(--pv-border); width: 100%;
  transition: border-color var(--pv-dur-quick) var(--pv-ease-out), background-color var(--pv-dur-quick) var(--pv-ease-out);
}
.pv-manage-action:hover { border-color: var(--pv-purple); background: var(--pv-lilac-mist); }
.pv-manage-action .pv-medallion { background: var(--pv-lilac); }
.pv-manage-action > span:nth-child(2) { flex: 1 1 8rem; min-width: 0; }
.pv-manage-action__label { font: 600 var(--pv-action-size)/var(--pv-action-line) var(--pv-font-body); color: var(--pv-ink); }
.pv-manage-action__caret { color: var(--pv-purple); transform: rotate(-90deg); }

/* ---------- PercyHeroSlot ---------- */
.pv-fox { --h: var(--pv-fox-mid); display: block; height: var(--h); aspect-ratio: 365 / 459; flex: none; }
.pv-fox[data-size="small"] { --h: var(--pv-fox-small); }
.pv-fox[data-size="hero"]  { --h: var(--pv-fox-hero); }
.pv-fox img, .pv-fox svg { width: 100%; height: 100%; }
.pv-fox-inline .fox-star { transform-box: fill-box; transform-origin: 40% 60%; }

/* ---------- Scenes ---------- */
.pv-scene { position: relative; isolation: isolate; overflow: hidden; border-radius: var(--pv-radius-scene); }
.pv-scene__art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.pv-scene--morning { background: linear-gradient(var(--pv-cream) 0%, var(--pv-sky-warm) 70%, var(--pv-sunshine) 100%); }
.pv-scene--journey { background: linear-gradient(var(--pv-lilac-mist), var(--pv-lilac)); }
.pv-scene__sky { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--pv-space-3); padding: var(--pv-space-5) var(--pv-space-4) 0; }
.pv-scene__sky > .pv-selector { grid-column: 1 / -1; }
.pv-scene__text { grid-column: 1 / -1; display: grid; gap: var(--pv-space-2); justify-items: start; align-content: start; }
.pv-scene__meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--pv-space-2); width: 100%; }
.pv-scene__fox { grid-column: 2; align-self: end; }
.pv-scene__ground { position: relative; background: var(--pv-purple); color: var(--pv-white); padding: var(--pv-space-2) var(--pv-space-4) var(--pv-space-4); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--pv-space-3); }
.pv-scene__ground > * { min-width: 0; }
.pv-scene__ground > .pv-btn { flex: 1 0 auto; }
.pv-scene__ground::before { /* hill crest, so Percy sits on the ground band */
  content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: var(--pv-space-5);
  background: var(--pv-purple); clip-path: ellipse(75% 100% at 70% 100%);
}
.pv-scene__ground .pv-t-support { color: var(--pv-lilac); }
.pv-scene__fox { position: relative; z-index: 1; margin-bottom: calc(var(--pv-space-2) * -1); }
.pv-chip { max-width: 100%; }
.pv-chip { display: inline-flex; align-items: center; gap: var(--pv-space-2); min-height: var(--pv-space-6); padding: var(--pv-space-1) var(--pv-space-3); border-radius: var(--pv-radius-full); background: var(--pv-white); color: var(--pv-ink); font: 600 var(--pv-support-size)/var(--pv-support-line) var(--pv-font-body); box-shadow: var(--pv-shadow-1); }
.pv-chip .pv-icon { color: var(--pv-orange-text); width: var(--pv-space-5); height: var(--pv-space-5); }
.pv-chip[data-tone="earn"] { background: var(--pv-earn-soft); color: var(--pv-earn); box-shadow: none; }
.pv-chip[data-tone="earn"] .pv-icon { color: var(--pv-earn); }
.pv-meadow { background: linear-gradient(var(--pv-meadow), var(--pv-meadow-deep)); border-radius: var(--pv-radius-scene); padding: var(--pv-space-5) var(--pv-space-4); display: grid; gap: var(--pv-space-5); }

/* ---------- Section and card ---------- */
.pv-section { display: grid; gap: var(--pv-space-4); }
.pv-section__head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--pv-space-3); flex-wrap: wrap; }
.pv-card { background: var(--pv-white); border-radius: var(--pv-radius-card); box-shadow: var(--pv-shadow-1); padding: var(--pv-space-4); }
.pv-proposed { border: 2px dashed var(--pv-input-border); background: transparent; box-shadow: none; }
.pv-flag { display: inline-block; padding: var(--pv-space-1) var(--pv-space-2); border-radius: var(--pv-space-1); background: var(--pv-ink); color: var(--pv-white); font: 600 var(--pv-meta-size)/var(--pv-meta-line) var(--pv-font-body); letter-spacing: 0.06em; text-transform: uppercase; }
.pv-flag[data-tone="warn"] { background: var(--pv-danger); }
.pv-flag[data-tone="ok"] { background: var(--pv-earn); }

/* ---------- App shell and AppNavigation ---------- */
.pv-app { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; padding-bottom: calc(var(--pv-nav-height) + env(safe-area-inset-bottom, 0px)); }
.pv-topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--pv-space-3); padding: var(--pv-space-3) var(--pv-gutter); }
.pv-topbar__logo { height: var(--pv-tap); width: auto; }
.pv-iconbtn { width: var(--pv-tap); height: var(--pv-tap); display: grid; place-items: center; border-radius: var(--pv-radius-full); color: var(--pv-purple); background: var(--pv-white); box-shadow: var(--pv-shadow-1); }
.pv-main { width: 100%; max-width: var(--pv-content-max); margin-inline: auto; padding: 0 var(--pv-gutter) var(--pv-space-6); display: grid; gap: var(--pv-space-6); align-content: start; }
.pv-main > * { min-width: 0; }
.pv-main:focus { outline: none; }
.pv-columns, .pv-columns > * { display: grid; gap: var(--pv-space-6); min-width: 0; align-content: start; }
a.pv-btn, a.pv-nav__tab { text-decoration: none; }
.pv-nav { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; background: var(--pv-white); border-top: 2px solid var(--pv-border); padding-bottom: env(safe-area-inset-bottom, 0px); }
.pv-nav ul { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); max-width: 34rem; margin-inline: auto; padding: var(--pv-space-1); }
.pv-nav__logo { display: none; }
.pv-nav__tab {
  width: 100%; min-height: calc(var(--pv-nav-height) - var(--pv-space-2)); display: grid; justify-items: center; align-content: center; gap: var(--pv-space-1);
  border-radius: var(--pv-radius-control); color: var(--pv-text-soft);
  font: 600 var(--pv-meta-size)/var(--pv-meta-line) var(--pv-font-body);
  /* Five tabs must always fit: the label grows with the text setting only until a tab is full. */
  font-size: min(var(--pv-meta-size), 3.75vw); overflow-wrap: anywhere; text-align: center;
}
.pv-nav__tab .pv-icon { width: calc(var(--pv-icon) + var(--pv-space-1)); height: calc(var(--pv-icon) + var(--pv-space-1)); }
.pv-nav__tab[aria-current="page"] { background: var(--pv-lilac); color: var(--pv-purple); }

/* ---------- Toast and dialog ---------- */
.pv-toast { position: fixed; z-index: 20; left: var(--pv-gutter); right: var(--pv-gutter); bottom: calc(var(--pv-nav-height) + var(--pv-space-4)); max-width: 28rem; margin-inline: auto; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--pv-space-3); padding: var(--pv-space-2) var(--pv-space-2) var(--pv-space-2) var(--pv-space-4); border-radius: var(--pv-radius-control); background: var(--pv-ink); color: var(--pv-white); box-shadow: var(--pv-shadow-2); animation: pv-rise var(--pv-dur-base) var(--pv-ease-out); }
.pv-toast[hidden] { display: none; }
.pv-toast .pv-btn { color: var(--pv-sunshine); }
.pv-dialog { width: min(28rem, calc(100vw - var(--pv-gutter) * 2)); border: 0; border-radius: var(--pv-radius-card); padding: var(--pv-space-5); color: var(--pv-text); box-shadow: var(--pv-shadow-2); }
.pv-dialog::backdrop { background: rgb(39 23 55 / 0.6); }
.pv-dialog form { display: grid; gap: var(--pv-space-4); }
.pv-field { display: grid; gap: var(--pv-space-2); }
.pv-field label { font: 600 var(--pv-action-size)/var(--pv-action-line) var(--pv-font-body); }
.pv-input { min-height: var(--pv-tap); padding: var(--pv-space-2) var(--pv-space-3); border-radius: var(--pv-radius-control); border: 2px solid var(--pv-input-border); font: 400 var(--pv-body-size)/var(--pv-body-line) var(--pv-font-body); color: var(--pv-ink); background: var(--pv-white); width: 100%; }
.pv-dialog__actions { display: flex; flex-wrap: wrap; gap: var(--pv-space-2); justify-content: flex-end; }

/* ---------- Motion ---------- */
@keyframes pv-pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes pv-rise { from { opacity: 0; transform: translateY(var(--pv-space-2)); } to { opacity: 1; transform: none; } }
@keyframes pv-fox-hop { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(calc(var(--pv-space-3) * -1)) rotate(-2deg); } 70% { transform: translateY(0) scaleY(0.97); } }
@keyframes pv-star-twinkle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.18) rotate(8deg); opacity: 0.85; } }
@keyframes pv-star-burst { 0% { transform: scale(1); } 40% { transform: scale(1.45) rotate(-14deg); } 100% { transform: scale(1); } }
@keyframes pv-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02, 1.035); } }
@keyframes pv-peek { 0%, 12% { transform: translateY(62%); } 30%, 80% { transform: translateY(0); } 100% { transform: translateY(62%); } }
.pv-fox[data-motion] svg, .pv-fox[data-motion] img { transform-origin: 50% 100%; }
.pv-fox[data-motion="idle"] .fox-star { animation: pv-star-twinkle var(--pv-dur-loop) ease-in-out infinite; }
.pv-fox[data-motion="award"] svg { animation: pv-fox-hop var(--pv-dur-celebrate) var(--pv-ease-out); }
.pv-fox[data-motion="award"] .fox-star { animation: pv-star-burst var(--pv-dur-celebrate) var(--pv-ease-bounce); }
.pv-fox[data-motion="rest"] svg { animation: pv-breathe calc(var(--pv-dur-loop) * 2) ease-in-out infinite; }
.pv-fox[data-motion="peek"] svg { animation: pv-peek calc(var(--pv-dur-loop) * 2) var(--pv-ease-out) infinite; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- Narrow phones (< 360): one-column actions, never smaller text ---------- */
@media (max-width: 359.98px) {
  .pv-scene__ground > .pv-btn { flex-basis: 100%; }
}

/* ---------- Tablet (>= 834) ---------- */
@media (min-width: 834px) {
  .pv-scene__sky { padding: var(--pv-space-6) var(--pv-space-6) 0; }
  .pv-scene__text { grid-column: 1; padding-bottom: var(--pv-space-6); }
  .pv-scene__meta { flex-direction: column; align-items: flex-start; gap: var(--pv-space-3); }
  .pv-scene__ground { padding-inline: var(--pv-space-6); }
  .pv-scene__ground > .pv-btn { flex-grow: 0; }
  .pv-meadow { padding: var(--pv-space-6); }
}

/* ---------- Desktop (>= 1100): side rail navigation ---------- */
@media (min-width: 1100px) {
  .pv-app { padding-bottom: 0; padding-left: var(--pv-rail-width); }
  .pv-topbar .pv-topbar__logo { visibility: hidden; }
  .pv-nav { top: 0; right: auto; width: var(--pv-rail-width); border-top: 0; border-right: 2px solid var(--pv-border); padding: var(--pv-space-5) var(--pv-space-4); }
  .pv-nav__logo { display: block; width: 100%; height: auto; margin-bottom: var(--pv-space-5); }
  .pv-nav ul { grid-template-columns: 1fr; gap: var(--pv-space-1); padding: 0; }
  .pv-nav__tab { grid-auto-flow: column; justify-content: start; justify-items: start; gap: var(--pv-space-3); min-height: var(--pv-tap); padding: var(--pv-space-3) var(--pv-space-4); font: 600 var(--pv-action-size)/var(--pv-action-line) var(--pv-font-body); }
  .pv-toast { bottom: var(--pv-space-5); left: calc(var(--pv-rail-width) + var(--pv-gutter)); }
  .pv-quick { grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); }
  .pv-columns { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start; }
}

.pv-profile { display: flex; flex-wrap: wrap; align-items: center; gap: var(--pv-space-4); padding: var(--pv-space-2) var(--pv-space-4) var(--pv-space-5); }
.pv-profile > div { flex: 1 1 9rem; min-width: 0; }
.pv-profile > .pv-profile__actions { flex-basis: 100%; }
.pv-profile__actions { display: flex; flex-wrap: wrap; gap: var(--pv-space-2); }
.pv-journey-head > div { flex: 1 1 9rem; min-width: 0; }
.pv-journey-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: var(--pv-space-3); }
.pv-balance { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 var(--pv-space-2); }
.pv-notice { display: grid; gap: var(--pv-space-3); justify-items: start; padding: var(--pv-space-6) 0; }
@media (min-width: 834px) { .pv-profile { padding: var(--pv-space-2) var(--pv-space-6) var(--pv-space-6); } }
</style>
</head>

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (n) => ICONS[n] || '';

  // ChildAvatar: photo first, initial fallback at the same size. A photo that
  // fails to load swaps to the fallback (see the error listener at the bottom).
  function avatar(child, size = 'other', { ring = false } = {}) {
    const initial = esc((child.name || '?').trim().charAt(0).toUpperCase());
    const img = child.photo ? `<img src="${esc(child.photo)}" alt="" data-avatar-img>` : '';
    return `<span class="pv-avatar" data-size="${size}" data-kid="${child.kid}"${ring ? ' data-ring' : ''} aria-hidden="true">${img || initial}<template>${initial}</template></span>`;
  }

  // ChildSelector: horizontal, scrollable, names always shown.
  function selector(children, selectedId, { emphasise = true } = {}) {
    if (children.length < 2) return '';
    return `<div class="pv-selector" role="group" aria-label="Choose a child">${children.map((c) => {
      const on = c.id === selectedId;
      return `<button type="button" class="pv-selector__item" data-select-child="${c.id}" aria-pressed="${on}" title="${esc(c.name)}">${avatar(c, on && emphasise ? 'selected' : 'other', { ring: on })}<span class="pv-selector__name">${esc(c.name)}</span></button>`;
    }).join('')}</div>`;
  }

  function quickTile(b, childName) {
    return `<button type="button" class="pv-quick-tile" data-tint="${b.tint}" data-quick="${esc(b.name)}"><span class="pv-medallion">${icon(b.icon)}</span><span class="pv-quick-tile__points"><span class="pv-sr">Give ${esc(childName)} </span>+${b.points}<span class="pv-sr"> for</span></span><span class="pv-quick-tile__label">${esc(b.name)}</span></button>`;
  }

  function goalRow(g) {
    const done = g.done ? ' data-done' : '';
    return `<li class="pv-goal"${done} data-goal="${g.id}">
      <button type="button" class="pv-goal__check" data-goal-toggle="${g.id}" aria-pressed="${!!g.done}" aria-label="${g.done ? 'Completed' : 'Mark complete'}: ${esc(g.title)}"><span>${icon('check')}</span></button>
      <div><p class="pv-goal__title">${esc(g.title)}</p><p class="pv-goal__meta">${g.done ? `Done, +${g.points} point${g.points === 1 ? '' : 's'}` : `+${g.points} point${g.points === 1 ? '' : 's'} when done`}</p></div>
      ${g.done ? `<button type="button" class="pv-goal__undo" data-goal-toggle="${g.id}" aria-label="Undo ${esc(g.title)}">Undo</button>` : ''}
    </li>`;
  }

  // PercyProgressRing: the arc is clamped to 0..1; the number shown beside it never is.
  // A zero or missing denominator draws the neutral dashed ring, never a percentage.
  function ring({ metric, value, max, iconName }) {
    const r = 42, c = 2 * Math.PI * r;
    const has = Number.isFinite(max) && max > 0 && Number.isFinite(value);
    const frac = has ? Math.min(1, Math.max(0, value / max)) : 0;
    const full = has && value >= max;
    return `<span class="pv-ring" data-metric="${metric}"${has ? '' : ' data-empty'}${full ? ' data-full' : ''} aria-hidden="true">
      <svg viewBox="0 0 100 100"><circle class="pv-ring__track" cx="50" cy="50" r="${r}" stroke-width="10"/>${has && frac > 0 ? `<circle class="pv-ring__value" cx="50" cy="50" r="${r}" stroke-width="10" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - frac)).toFixed(2)}"/>` : ''}</svg>
      <span class="pv-ring__centre">${icon(full ? 'check-circle' : iconName)}</span></span>`;
  }

  function stop({ metric, value, max, iconName, label, unit, note, tone, action }) {
    const has = Number.isFinite(max) && max > 0;
    return `<li class="pv-stop">${ring({ metric, value, max, iconName })}<div>
      <p class="pv-stop__label">${esc(label)}</p>
      ${has ? `<p class="pv-stop__figure"><span class="pv-t-number-sm">${value}</span><small>of ${max} ${esc(unit)}</small></p>` : ''}
      <p class="pv-stop__note"${tone ? ` data-tone="${tone}"` : ''}>${esc(note)}</p>${action || ''}</div></li>`;
  }

  function achievement({ state, iconName, title, text }) {
    return `<li class="pv-achievement" data-state="${state}"><span class="pv-medallion">${icon(iconName)}</span><div><p class="pv-t-card">${esc(title)}</p><p class="pv-t-support">${esc(text)}</p></div></li>`;
  }

  function manageAction({ id, iconName, label, text }) {
    return `<li><button type="button" class="pv-manage-action" data-manage="${id}"><span class="pv-medallion">${icon(iconName)}</span><span><span class="pv-manage-action__label">${esc(label)}</span><br><span class="pv-t-support">${esc(text)}</span></span><span class="pv-manage-action__caret">${icon('caret-down')}</span></button></li>`;
  }

  // PercyHeroSlot: resolves a stable fox1a.<pose> key. Until source-faithful
  // pose artwork exists, every key resolves to the seated master (the fallback
  // docs/brand/FOX_1A_POSE_LIBRARY.md requires).
  const POSES = { seated: FOX_SRC };
  function fox({ pose = 'seated', size = 'mid', alt = '' } = {}) {
    const src = POSES[pose] || POSES.seated;
    return `<span class="pv-fox" data-size="${size}" data-pose="${pose}" data-resolved="${POSES[pose] ? pose : 'seated'}"><img src="${src}" alt="${esc(alt)}"${alt ? '' : ' aria-hidden="true"'}></span>`;
  }

  // BiggerGoalDestination: one named goal, saved / cost. Saved points are their
  // own figure and are never derived from the available balance.
  const FLAG = `<svg class="pv-destination__flag" width="44" height="72" viewBox="0 0 44 72" aria-hidden="true"><rect x="6" y="4" width="5" height="68" rx="2.5" fill="var(--pv-purple)"/><path d="M11 8h27l-8 11 8 11H11z" fill="var(--pv-orange)"/></svg>`;
  function destination(b, { headingId = 'dest-title' } = {}) {
    if (!b) return `<div class="pv-card pv-stop">${ring({ metric: 'goal', value: 0, max: 0, iconName: 'gift' })}<div><p class="pv-stop__label">No bigger goal yet</p><p class="pv-stop__note">Mark a reward as a bigger goal to start saving for it.</p><a class="pv-goal__undo" href="#rewards" style="display:inline-flex;align-items:center">Choose a reward</a></div></div>`;
    const left = Math.max(0, b.cost - b.saved);
    return `<article class="pv-destination" aria-labelledby="${headingId}">
      <div class="pv-destination__scene"><div style="display:grid;gap:var(--pv-space-1);padding-bottom:var(--pv-space-3)"><p class="pv-t-meta" style="color:var(--pv-ink)">Bigger goal</p><h3 class="pv-t-card pv-wrap" id="${headingId}">${esc(b.name)}</h3></div>${FLAG}</div>
      <div class="pv-destination__body">
        <div class="pv-stop">${ring({ metric: 'goal', value: b.saved, max: b.cost, iconName: b.icon })}<div><p class="pv-stop__figure"><span class="pv-t-number-sm">${b.saved}</span><small>of ${b.cost} points saved</small></p><p class="pv-stop__note"${left ? '' : ' data-tone="earn"'}>${left ? `${left} to go` : 'Fully saved. Ready to redeem.'}</p></div></div>
        <button type="button" class="pv-btn pv-btn--secondary pv-btn--block" data-info="Savings|Opens the V1 Savings dialog (save, release, reassign, redeem, each with its confirmation). Unchanged from V1.">${icon('piggy-bank')}Manage savings</button>
      </div></article>`;
  }

  const TABS = [['home', 'Home', 'house-line'], ['children', 'Children', 'users'], ['activity', 'Activity', 'chart-line-up'], ['rewards', 'Rewards', 'gift'], ['settings', 'Settings', 'gear']];
  function nav(active, logoSrc) {
    return `<nav class="pv-nav" aria-label="Main">${logoSrc ? `<img class="pv-nav__logo" src="${logoSrc}" alt="Positive Percy">` : ''}<ul>${TABS.map(([id, label, ic]) => `<li><a class="pv-nav__tab" href="#${id}"${id === active ? ' aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></a></li>`).join('')}</ul></nav>`;
  }

  // A photo that cannot load falls back to the initial, same size.
  document.addEventListener('error', (e) => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement) || !img.hasAttribute('data-avatar-img')) return;
    const a = img.closest('.pv-avatar');
    a.textContent = a.querySelector('template').innerHTML;
    a.setAttribute('data-photo-failed', '');
  }, true);

  // Keep the selected child in view when the selector scrolls.
  function revealSelected(root = document) {
    root.querySelectorAll('.pv-selector').forEach((sel) => {
      const on = sel.querySelector('[aria-pressed="true"]'); if (!on) return;
      sel.scrollLeft = Math.max(0, on.offsetLeft - sel.offsetLeft - (sel.clientWidth - on.offsetWidth) / 2);
    });
  }

  return { icon, esc, avatar, selector, quickTile, goalRow, ring, stop, destination, achievement, manageAction, fox, nav, revealSelected, FOX_SRC };
})();

</script>
<script>
// ---- Synthetic review data. Fictional children. No photos are shipped: a photo
// appears only when the reviewer picks one from their own device (it stays in this tab).
const params = new URLSearchParams(location.search);
const BEHAVIOURS = [
  { name: 'Kindness', icon: 'heart', points: 1, tint: 'sun' },
  { name: 'Helpfulness', icon: 'handshake', points: 1, tint: 'green' },
  { name: 'Bravery', icon: 'shield-star', points: 1, tint: 'lilac' },
  { name: 'Resilience', icon: 'mountains', points: 1, tint: 'peach' },
];
let CHILDREN = [
  { id: 'c1', name: 'Lara', age: 9, kid: 1, photo: null, available: 112, weekEarned: 34, weeklyTarget: 30,
    goals: [{ id: 'g1', title: 'Finish homework', points: 1, done: true }, { id: 'g2', title: 'Help set the table', points: 1, done: true }, { id: 'g3', title: 'Read for 15 minutes', points: 1, done: false }],
    bigger: { name: 'New bike', saved: 120, cost: 400, icon: 'bicycle' } },
  { id: 'c2', name: 'Omar', age: 6, kid: 2, photo: null, available: 40, weekEarned: 5, weeklyTarget: 20,
    goals: [{ id: 'g4', title: 'Brush teeth, morning and night', points: 1, done: false }, { id: 'g5', title: 'Tidy toys away', points: 2, done: false }],
    bigger: { name: 'Trip to the aquarium', saved: 30, cost: 150, icon: 'fish' } },
  { id: 'c3', name: 'Joud', age: 4, kid: 3, photo: null, available: 12, weekEarned: 0, weeklyTarget: 0, goals: [], bigger: null },
  { id: 'c4', name: 'Alexandra-Josephine Montgomery-Wellington', age: 11, kid: 4, photo: null, available: 1000, weekEarned: 30, weeklyTarget: 20,
    goals: [{ id: 'g6', title: 'Practise the piano for twenty minutes before dinner without being reminded', points: 3, done: false }], bigger: { name: 'A very long reward title that has to wrap on a small phone screen', saved: 5000, cost: 5000, icon: 'trophy' } },
  { id: 'c5', name: 'Sam', age: 7, kid: 5, photo: 'broken://no-such-photo', available: 0, weekEarned: 0, weeklyTarget: 10, goals: [], bigger: null },
  { id: 'c6', name: 'Noor', age: 2, kid: 6, photo: null, available: 3, weekEarned: 3, weeklyTarget: 5, goals: [], bigger: null },
];
CHILDREN = CHILDREN.slice(0, Math.min(6, Math.max(1, Number(params.get('children')) || 3)));
if (params.get('long')) { CHILDREN[0] = { ...CHILDREN[0], name: 'Alexandra-Josephine Montgomery-Wellington' }; }
const state = { view: 'home', childId: (params.get('child') && CHILDREN.find((c) => c.id === params.get('child')) ? params.get('child') : CHILDREN[0].id) };
const child = () => CHILDREN.find((c) => c.id === state.childId);
const pts = (n) => `${n} point${n === 1 ? '' : 's'}`;
const LOGO = document.querySelector('.pv-topbar__logo').src;
const TODAY = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(2026, 10, 23));

const SUN_SCENE = `<svg class="pv-scene__art" viewBox="0 0 400 300" preserveAspectRatio="xMinYMax slice" aria-hidden="true"><circle cx="60" cy="262" r="150" fill="#fff" opacity=".35"/><circle cx="60" cy="262" r="104" fill="var(--pv-sunshine)"/><g fill="#fff" opacity=".9"><rect x="250" y="40" width="96" height="26" rx="13"/><rect x="278" y="24" width="52" height="30" rx="15"/></g></svg>`;
const SKY_SCENE = `<svg class="pv-scene__art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><g fill="#fff" opacity=".75"><rect x="262" y="34" width="104" height="26" rx="13"/><rect x="290" y="18" width="54" height="30" rx="15"/></g><path d="M0 300V236C70 196 150 206 220 232s130 22 180-12v80z" fill="#fff" opacity=".55"/></svg>`;

function home() {
  const c = child();
  const done = c.goals.filter((g) => g.done).length;
  return `
  <div class="pv-columns">
    <div>
      <section class="pv-scene pv-scene--morning" aria-labelledby="home-title">
        ${SUN_SCENE}
        <div class="pv-scene__sky">
          ${PV.selector(CHILDREN, c.id)}
          <div class="pv-scene__text">
            <div class="pv-scene__meta"><p class="pv-t-meta">${TODAY}</p><span class="pv-chip">${PV.icon('sparkle')}3-day family streak</span></div>
            <h1 class="pv-t-hero pv-wrap" id="home-title">What went well for ${PV.esc(c.name)} today?</h1>
          </div>
            <div class="pv-scene__fox" id="home-fox">${PV.fox({ pose: 'seated', size: 'hero' })}</div>
        </div>
        <div class="pv-scene__ground pv-on-dark">
          <div><p class="pv-t-support">Ready to use</p><p class="pv-balance"><span class="pv-t-number" id="balance">${c.available}</span><span class="pv-t-action">Percy Points</span></p></div>
          <a class="pv-btn pv-btn--sun" href="#rewards">${PV.icon('gift')}Rewards</a>
        </div>
      </section>
      <section class="pv-section" aria-labelledby="quick-title">
        <div><h2 class="pv-t-section" id="quick-title">Quick Points</h2><p class="pv-t-support">Tap when ${PV.esc(c.name)} does something great.</p></div>
        <div class="pv-quick">${BEHAVIOURS.map((b) => PV.quickTile(b, c.name)).join('')}</div>
        <button type="button" class="pv-btn pv-btn--secondary pv-btn--block" data-info="Award points|Opens the V1 Award points dialog (any behaviour, any amount, optional note). Unchanged from V1; not rebuilt in this design prototype.">${PV.icon('plus-circle')}Award other points</button>
      </section>
    </div>
    <div>
      <section class="pv-section" aria-labelledby="goals-title">
        <div class="pv-section__head">
          <div><h2 class="pv-t-section" id="goals-title">Today's Goals</h2><p class="pv-t-support">${c.goals.length ? `${done} of ${c.goals.length} done` : 'Nothing scheduled today'}</p></div>
          ${c.goals.length ? `<span class="pv-progress-dots" aria-hidden="true">${c.goals.map((g) => `<i${g.done ? ' data-on' : ''}></i>`).join('')}</span>` : ''}
        </div>
        ${c.goals.length ? `<ul class="pv-goals">${c.goals.map(PV.goalRow).join('')}</ul>`
          : `<div class="pv-empty"><p class="pv-t-card">No goals for ${PV.esc(c.name)} today</p><p class="pv-t-support">Add a weekly routine or a one-off task to give them something to work towards.</p><a class="pv-btn pv-btn--primary" href="#children">Set up goals</a></div>`}
      </section>
    </div>
  </div>`;
}

function children() {
  const c = child();
  const done = c.goals.filter((g) => g.done).length;
  const over = c.weekEarned - c.weeklyTarget;
  const weekNote = !(c.weeklyTarget > 0) ? 'No weekly target set yet' : over >= 0 ? (over ? `Target reached, ${over} extra` : 'Target reached') : `${-over} to reach this week's target`;
  const b = c.bigger;
  return `
  <section class="pv-scene pv-scene--journey" aria-labelledby="child-title">
    ${SKY_SCENE}
    <div class="pv-scene__sky">${PV.selector(CHILDREN, c.id, { emphasise: false })}</div>
    <div class="pv-profile">
      ${PV.avatar(c, 'profile', { ring: true })}
      <div><h1 class="pv-t-page pv-wrap" id="child-title">${PV.esc(c.name)}</h1><p class="pv-t-body">Age ${c.age} · ${pts(c.available)} ready to use</p></div>
      <div class="pv-profile__actions">
        <button type="button" class="pv-btn pv-btn--primary" data-photo>${PV.icon('camera')}${c.photo ? 'Change photo' : 'Add photo'}</button>
        <button type="button" class="pv-btn pv-btn--secondary" data-info="Edit profile|Opens the V1 Edit child dialog (name, age, photo). Unchanged from V1.">${PV.icon('pencil')}Edit profile</button>
        <button type="button" class="pv-btn pv-btn--secondary" data-info="View as child|Opens the V1 child view inside the parent app. No child login or separate device.">View as child</button>
      </div>
    </div>
  </section>
  <div class="pv-columns">
    <div>
      <section class="pv-meadow" aria-labelledby="journey-title">
        <div class="pv-journey-head"><div><h2 class="pv-t-section pv-wrap" id="journey-title">${PV.esc(c.name)}'s journey</h2><p class="pv-t-support" style="color:var(--pv-ink)">Today, this week, and the bigger goal.</p></div>${PV.fox({ pose: 'walking', size: 'mid' })}</div>
        <ol class="pv-journey">
          ${PV.stop({ metric: 'today', value: done, max: c.goals.length, iconName: 'list-checks', label: "Today's goals", unit: 'done', note: c.goals.length ? (done === c.goals.length ? 'All done today' : `${c.goals.length - done} to go`) : 'No goals scheduled today', tone: c.goals.length && done === c.goals.length ? 'earn' : '' })}
          ${PV.stop({ metric: 'week', value: c.weekEarned, max: c.weeklyTarget, iconName: 'target', label: 'This week', unit: 'points', note: weekNote, tone: c.weeklyTarget > 0 && over >= 0 ? 'earn' : '', action: `<button type="button" class="pv-goal__undo" data-edit-target>Edit target</button>` })}
        </ol>
        ${PV.destination(b)}
      </section>
    </div>
    <div>
      <section class="pv-section" aria-labelledby="ach-title">
        <h2 class="pv-t-section" id="ach-title">Achievements</h2>
        <ul style="display:grid;gap:var(--pv-space-2)">
          ${PV.achievement({ state: done ? 'earned' : 'next', iconName: 'medal', title: 'Goals completed', text: `${done} today` })}
          ${PV.achievement({ state: c.weeklyTarget > 0 && over >= 0 ? 'earned' : 'next', iconName: 'trophy', title: c.weeklyTarget > 0 && over >= 0 ? 'Weekly target reached' : 'Next milestone', text: c.weeklyTarget > 0 ? (over >= 0 ? `${c.weekEarned} points this week` : `Weekly target: ${-over} points to go`) : 'Set a weekly target to begin' })}
        </ul>
      </section>
      <section class="pv-section" aria-labelledby="manage-title">
        <h2 class="pv-t-section" id="manage-title">Manage</h2>
        <ul class="pv-manage">
          ${PV.manageAction({ id: 'target', iconName: 'target', label: 'Weekly target', text: c.weeklyTarget > 0 ? `${c.weeklyTarget} points a week` : 'Not set' })}
          ${PV.manageAction({ id: 'goals', iconName: 'calendar-dots', label: 'Goals and schedule', text: `${c.goals.length} scheduled today` })}
          ${PV.manageAction({ id: 'rewards', iconName: 'gift', label: 'Rewards', text: 'Weekly treats and bigger goals' })}
          ${PV.manageAction({ id: 'savings', iconName: 'piggy-bank', label: 'Savings', text: b ? `${b.saved} points saved` : 'Nothing saved yet' })}
        </ul>
      </section>
    </div>
  </div>`;
}

function other(name) {
  return `<section class="pv-notice"><h1 class="pv-t-page">${name}</h1><p class="pv-t-body">Not part of this review. ${name} keeps its V1 design until Home and Children are approved.</p><a class="pv-btn pv-btn--primary" href="#home">Back to Home</a></section>`;
}

function render({ focus = false } = {}) {
  const v = state.view;
  document.getElementById('view').innerHTML = v === 'home' ? home() : v === 'children' ? children() : other(v[0].toUpperCase() + v.slice(1));
  document.getElementById('nav').innerHTML = PV.nav(v, LOGO);
  PV.revealSelected();
  document.title = `${v === 'home' ? 'Home' : v === 'children' ? 'Children' : v} · Positive Percy V1.1 design prototype`;
  if (focus) { document.getElementById('view').focus({ preventScroll: true }); window.scrollTo(0, 0); }
}
function route() { const h = location.hash.slice(1); state.view = ['home', 'children', 'activity', 'rewards', 'settings'].includes(h) ? h : 'home'; render({ focus: true }); }
addEventListener('hashchange', route);

let undo = null, toastTimer = 0;
function toast(text, onUndo) {
  undo = onUndo; clearTimeout(toastTimer);
  document.getElementById('toast-text').textContent = text;
  document.getElementById('toast').hidden = false;
  toastTimer = setTimeout(() => { document.getElementById('toast').hidden = true; undo = null; }, 6000);
}
document.getElementById('toast-undo').addEventListener('click', () => { if (undo) undo(); undo = null; document.getElementById('toast').hidden = true; render(); });

function celebrate() { // one-shot Percy response; removed again so it can replay
  const f = document.querySelector('#home-fox .pv-fox'); if (!f) return;
  f.querySelector('img').style.animation = 'pv-fox-hop var(--pv-dur-celebrate) var(--pv-ease-out)';
}
function refocus(sel) { const el = document.querySelector(sel); if (el) el.focus({ preventScroll: true }); }

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-select-child],[data-quick],[data-goal-toggle],[data-edit-target],[data-manage],[data-info],[data-photo]');
  if (!t) return;
  const c = child();
  if (t.dataset.selectChild) { state.childId = t.dataset.selectChild; render(); refocus(`[data-select-child="${state.childId}"]`); return; }
  if (t.dataset.quick) {
    const b = BEHAVIOURS.find((x) => x.name === t.dataset.quick);
    c.available += b.points; c.weekEarned += b.points;
    render(); const tile = document.querySelector(`[data-quick="${b.name}"]`); tile.setAttribute('data-given', ''); tile.focus({ preventScroll: true }); celebrate();
    toast(`+${b.points} for ${b.name}. ${c.name} has ${c.available}.`, () => { c.available -= b.points; c.weekEarned -= b.points; });
    return;
  }
  if (t.dataset.goalToggle) {
    const g = c.goals.find((x) => x.id === t.dataset.goalToggle); const d = g.done ? -g.points : g.points;
    g.done = !g.done; c.available += d; c.weekEarned += d;
    render(); refocus(`.pv-goal__check[data-goal-toggle="${g.id}"]`); if (g.done) celebrate();
    return;
  }
  if (t.hasAttribute('data-edit-target') || t.dataset.manage === 'target') {
    const d = document.getElementById('target-dialog'); document.getElementById('target-input').value = c.weeklyTarget; d.returnValue = ''; d.showModal(); return;
  }
  if (t.dataset.manage) {
    const m = { goals: ['Goals and schedule', 'Opens the V1 Manage goals dialog (add, edit, schedule, pause, archive). Unchanged from V1.'], rewards: ['Rewards', 'Goes to the V1 Rewards tab. Not part of this review.'], savings: ['Savings', 'Opens the V1 Savings dialog (save, release, reassign, redeem, each with its confirmation). Unchanged from V1.'] }[t.dataset.manage];
    info(m[0], m[1]); return;
  }
  if (t.dataset.info) { const [a, b] = t.dataset.info.split('|'); info(a, b); return; }
  if (t.hasAttribute('data-photo')) document.getElementById('photo-input').click();
});
function info(title, text) { document.getElementById('info-title').textContent = title; document.getElementById('info-text').textContent = text; document.getElementById('info-dialog').showModal(); }
document.getElementById('target-dialog').addEventListener('close', (e) => {
  if (e.target.returnValue !== 'save') return;
  const n = Math.round(Number(document.getElementById('target-input').value));
  if (Number.isFinite(n) && n >= 0) { child().weeklyTarget = n; render(); }
});
document.getElementById('photo-input').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  child().photo = URL.createObjectURL(f); e.target.value = ''; render();
});
route();
</script>
</body>
</html>
